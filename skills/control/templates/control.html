<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:wght@400;600&family=Iosevka+Charon+Mono:wght@400;600&display=swap">
<script>
  // Apply the saved theme, else the system one, before first paint.
  document.documentElement.dataset.theme = localStorage.getItem('control-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<style>
  /* PragmataPro from the installed font files. Safari does not let pages use a
     user-installed font by name, but it loads the file itself. Machines without
     PragmataPro fall back to Iosevka Charon. */
  @font-face { font-family: "PragmataPro"; font-weight: 400; src: url("file://{{home}}/Library/Fonts/PragmataProR_09.ttf"); }
  @font-face { font-family: "PragmataPro"; font-weight: 600; src: url("file://{{home}}/Library/Fonts/PragmataProB_09.ttf"); }
  @font-face { font-family: "PragmataPro Mono"; font-weight: 400; src: url("file://{{home}}/Library/Fonts/PragmataPro_Mono_R_09.ttf"); }
  @font-face { font-family: "PragmataPro Mono"; font-weight: 600; src: url("file://{{home}}/Library/Fonts/PragmataPro_Mono_B_09.ttf"); }

  /* Colours: FEMS portal light and dark themes. */
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f4f6f9; --panel: #fff; --rule: #e1e6ec; --control: #e2e7ee;
    --fg: #1b2430; --heading: #0b1220; --muted: #4f5b6a; --accent: #1f5fa8;
    --success: #1b7340; --warning: #855300; --error: #b3261e; --info: #1d5fa3;
    --table-head: var(--heading); --table-head-bg: #d5dce4; --tone-shade: 35%; --tone-tint: 24%;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #161b22; --panel: #1c232c; --rule: #2c3540; --control: #2a323d;
    --fg: #e6eaf0; --heading: #fff; --muted: #a6b0bd; --accent: #6cb2f5;
    --success: #5fd08a; --warning: #e8b85a; --error: #f2817a; --info: #79b8f5;
    --table-head: var(--muted); --table-head-bg: #232b35; --tone-shade: 0%; --tone-tint: 14%;
  }
  /*
   * Rhythm by construction: both columns are stacks of rows. Every text line is one
   * --lead line, every row is that line inside --row-pad, and both columns start at the
   * same point with a head of the same shape, so baselines line up across columns.
   * Space between sidebar sections is a whole --row; the views and tables sit directly
   * under their heads.
   * Never set a line-height or vertical padding outside these tokens.
   */
  :root {
    --lead: 24px;
    --row-pad: 6px;
    --row: calc(var(--lead) + var(--row-pad) * 2);
    --gutter: .75rem;
    --radius: .375rem;
    --text-xs: 12px; --text-sm: 13px; --text-md: 14px; --text-base: 15px; --text-lg: 20px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: var(--text-base)/var(--lead) "PragmataPro", "PragmataPro Mono", "Iosevka Charon", ui-sans-serif, sans-serif;
  }
  code { font: .9em/1 "PragmataPro Mono", "PragmataPro", "Iosevka Charon Mono", ui-monospace, monospace; }
  h1, h2, p { margin: 0; }
  ul { list-style: none; margin: 0; padding: 0; }

  .shell {
    display: grid; grid-template-columns: 15rem 1fr; column-gap: 2rem; align-items: start;
    max-width: 80rem; margin: 0 auto; padding: 0 1rem;
  }
  /* Sidebar spans the full window height; its content starts one --row down, like main's. */
  aside {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column;
    padding: var(--row) var(--gutter);
    background: var(--panel); box-shadow: inset 1px 0 0 var(--rule), inset -1px 0 0 var(--rule);
  }
  main { min-width: 0; padding-block: var(--row); }
  @media (max-width: 48rem) {
    .shell { grid-template-columns: 1fr; row-gap: var(--row); }
    aside { position: static; height: auto; }
  }

  /* Head: title line and meta line, padded to two rows in both columns. */
  .head { padding: calc(var(--row-pad) * 2) 0; }
  aside .head { padding-inline: var(--gutter); }
  aside nav { margin-top: var(--row); }
  aside nav:last-of-type { margin-bottom: var(--row); }
  .head h1, .head h2 { font-size: var(--text-lg); color: var(--heading); }
  .meta { font-size: var(--text-sm); color: var(--muted); }

  /* Rows: every sidebar entry, section label and table cell is one --row. */
  aside label, aside a, aside nav h2, #theme, th, td {
    padding: var(--row-pad) var(--gutter);
  }
  aside nav h2, thead th {
    font-size: var(--text-xs); font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted);
  }
  aside label, aside a, #theme {
    display: flex; justify-content: space-between;
    border-radius: var(--radius); color: var(--fg); text-decoration: none; cursor: pointer;
  }
  aside label:hover, aside a:hover { background: var(--control); }
  aside a { color: var(--accent); }
  .count { font-size: var(--text-sm); color: var(--muted); }
  .count.hot { font-weight: 600; color: var(--warning); }
  #theme {
    margin-top: auto; border: 0; font-family: inherit; font-size: var(--text-md); line-height: var(--lead);
    background: var(--control);
  }
  #theme::after { content: "Dark"; }
  [data-theme="dark"] #theme::after { content: "Light"; }

  /* Views: CSS-only tabs driven by the radio inputs before .shell. */
  input[name=view] { position: absolute; opacity: 0; pointer-events: none; }
  .panel { display: none; }
  #view-tasks:checked ~ .shell [for=view-tasks],
  #view-attention:checked ~ .shell [for=view-attention],
  #view-agents:checked ~ .shell [for=view-agents] {
    font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--panel));
  }
  #view-tasks:checked ~ .shell #tasks,
  #view-attention:checked ~ .shell #attention,
  #view-agents:checked ~ .shell #agents { display: block; }
  input[name=view]:focus-visible ~ .shell .views { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius); }

  /* Tables: one tbody per group; the tbody class sets the group's tone. */
  /* Fixed layout: column widths come from the column definitions in the script, so long
     text in one column cannot squeeze a short one into a word per line. */
  table {
    width: 100%; table-layout: fixed; border-collapse: collapse;
    background: var(--panel); border-radius: var(--radius); overflow: hidden;
  }
  th, td { text-align: left; vertical-align: top; overflow-wrap: break-word; box-shadow: inset 0 -1px 0 var(--rule); }
  thead th { color: var(--table-head); background: var(--table-head-bg); }
  tbody th {
    --tone-ink: color-mix(in srgb, var(--tone), #000 var(--tone-shade));
    font-size: var(--text-sm); color: var(--tone-ink); background: color-mix(in srgb, var(--tone) var(--tone-tint), var(--panel));
    box-shadow: inset 3px 0 0 var(--tone), inset 0 -1px 0 var(--rule);
  }
  tbody th .count {
    margin-left: .35rem; padding: 0 .4rem; border-radius: 999px;
    color: var(--tone-ink); background: color-mix(in srgb, var(--tone) calc(var(--tone-tint) + 8%), var(--panel));
  }
  tbody td:first-child { padding-left: calc(var(--gutter) * 2); }
  td.dim { font-size: var(--text-md); color: var(--muted); }
  td.when { white-space: nowrap; }
  .todo { --tone: var(--muted); }
  .doing, .agent { --tone: var(--info); }
  .waiting { --tone: var(--warning); }
  .blocked { --tone: var(--error); }
  .done { --tone: var(--success); }
  tbody.done td { color: var(--muted); }
</style>
</head>
<body>
<!--
  Fixed template: every view, count and link renders from control.data.js next to this
  file, and agents update the page by editing only that file. Keep the look (colours,
  fonts, row tokens) so every control page reads the same. Change views, columns or
  groups here, together with the data shape documented in control.data.js, only when
  chakrit asks.
-->
<input type="radio" name="view" id="view-tasks">
<input type="radio" name="view" id="view-attention" checked>
<input type="radio" name="view" id="view-agents">
<div class="shell">
<aside>
  <div class="head">
    <h1 id="title">Control</h1>
    <p class="meta" id="updated">loading control.data.js</p>
  </div>

  <ul class="views">
    <li><label for="view-tasks">Tasks <span class="count" id="count-tasks"></span></label></li>
    <li><label for="view-attention">Needs Attention <span class="count" id="count-attention"></span></label></li>
    <li><label for="view-agents">Agent Backlog <span class="count" id="count-agents"></span></label></li>
  </ul>

  <nav>
    <h2>Links</h2>
    <ul id="links"></ul>
  </nav>

  <button id="theme" type="button" aria-label="Switch theme"></button>
</aside>

<main>
<section id="tasks" class="panel">
  <div class="head"><h2>Tasks</h2><p class="meta">0 items</p></div>
</section>

<section id="attention" class="panel">
  <div class="head"><h2>Needs Attention</h2><p class="meta">0 items</p></div>
</section>

<section id="agents" class="panel">
  <div class="head"><h2>Agent Backlog</h2><p class="meta">0 items</p></div>
</section>
</main>
</div>
<script>
  document.getElementById('theme').addEventListener('click', () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('control-theme', root.dataset.theme);
  });
</script>
<!-- A script tag, not fetch: browsers block fetch of local files on a file:// page. -->
<script src="control.data.js"></script>
<script>
  // Group order and labels; each key is also the tbody class that sets the group's tone.
  const TASK_GROUPS = [
    { key: 'doing', label: 'In progress' },
    { key: 'todo', label: 'To do' },
    { key: 'done', label: 'Done' },
  ];
  const BACKLOG_GROUPS = [
    { key: 'blocked', label: 'Blocked' },
    { key: 'waiting', label: 'Waiting on chakrit' },
    { key: 'doing', label: 'In progress' },
    { key: 'todo', label: 'Queued' },
    { key: 'done', label: 'Done' },
  ];

  // One entry per table column, in column order: the data field, the header, the cell
  // class and the width. Short fields get a fixed width; prose columns take '' and share
  // what is left equally.
  const TASK_COLUMNS = [
    { field: 'item', label: 'Item', cell: '', width: '' },
    { field: 'source', label: 'Source', cell: 'dim', width: '16rem' },
    { field: 'since', label: 'Since', cell: 'dim when', width: '6rem' },
  ];
  const ATTENTION_COLUMNS = [
    { field: 'item', label: 'Item', cell: '', width: '' },
    { field: 'where', label: 'Where to act', cell: 'dim', width: '12rem' },
    { field: 'recommendation', label: 'Recommendation', cell: '', width: '' },
    { field: 'since', label: 'Since', cell: 'dim when', width: '6rem' },
  ];
  const BACKLOG_COLUMNS = [
    { field: 'item', label: 'Item', cell: '', width: '' },
    { field: 'agent', label: 'Agent', cell: 'dim', width: '13rem' },
    { field: 'source', label: 'Source', cell: 'dim', width: '14rem' },
    { field: 'next', label: 'Next / evidence', cell: 'dim', width: '' },
  ];
  const PROBLEM_COLUMNS = [
    { field: 'problem', label: 'Problem', cell: '', width: '' },
  ];

  const LINK_SCHEMA = { label: text, href: relativeHref };
  const CONTROL_SCHEMA = {
    title: text,
    updated: text,
    tasks: shape(groupsSchema(TASK_GROUPS, TASK_COLUMNS)),
    attention: listOf(shape({ agent: text, items: listOf(shape(rowSchema(ATTENTION_COLUMNS))) })),
    backlog: shape(groupsSchema(BACKLOG_GROUPS, BACKLOG_COLUMNS)),
    links: listOf(shape(LINK_SCHEMA)),
  };
  const NOT_LOADED = 'window.CONTROL is not set: control.data.js is missing next to this '
    + 'page, has a syntax error, or does not assign window.CONTROL.';

  const data = window.CONTROL;
  const problems = isRecord(data) ? shapeProblems(data, CONTROL_SCHEMA, 'CONTROL') : [NOT_LOADED];
  if (problems.length > 0) {
    renderProblems(problems);
  } else {
    render(data);
  }

  // Rendering. Every data value enters the page through textContent or an href.

  function render(control) {
    const taskCount = TASK_GROUPS.flatMap((group) => control.tasks[group.key]).length;
    const attentionCount = control.attention.flatMap((entry) => entry.items).length;
    const backlogCount = BACKLOG_GROUPS.flatMap((group) => control.backlog[group.key]).length;

    document.title = control.title;
    document.getElementById('title').textContent = control.title;
    document.getElementById('updated').textContent = `updated ${control.updated}`;
    document.getElementById('links').append(...linkItems(control.links));
    fillView('tasks', TASK_COLUMNS, statusBodies(control.tasks, TASK_GROUPS, TASK_COLUMNS), taskCount);
    fillView('attention', ATTENTION_COLUMNS, attentionBodies(control.attention), attentionCount);
    fillView('agents', BACKLOG_COLUMNS, statusBodies(control.backlog, BACKLOG_GROUPS, BACKLOG_COLUMNS), backlogCount);
    document.getElementById('count-attention').classList.toggle('hot', attentionCount > 0);
  }

  function renderProblems(found) {
    const head = element('div', 'head');
    head.append(element('h2', '', 'Control data error'),
      element('p', 'meta', 'Fix control.data.js, then reload this page.'));
    const rows = found.map((problem) => ({ problem }));
    const body = groupBody('blocked', ['Problems'], rows, PROBLEM_COLUMNS);
    const section = element('section');
    section.append(head, columnTable(PROBLEM_COLUMNS, [body]));

    document.getElementById('updated').textContent = 'no valid data';
    document.querySelector('main').replaceChildren(section);
  }

  function fillView(id, columns, bodies, rowCount) {
    const section = document.getElementById(id);

    section.append(columnTable(columns, bodies));
    section.querySelector('.meta').textContent = rowCount === 1 ? '1 item' : `${rowCount} items`;
    document.getElementById(`count-${id}`).textContent = String(rowCount);
  }

  function columnTable(columns, bodies) {
    const colgroup = element('colgroup');
    colgroup.append(...columns.map(columnWidth));
    const headRow = element('tr');
    headRow.append(...columns.map((column) => element('th', '', column.label)));
    const head = element('thead');
    head.append(headRow);

    const table = element('table');
    table.append(colgroup, head, ...bodies);
    return table;
  }

  function columnWidth(column) {
    const col = element('col');
    col.style.width = column.width;
    return col;
  }

  function statusBodies(groups, defs, columns) {
    return defs
      .filter((group) => groups[group.key].length > 0)
      .map((group) => groupBody(group.key, [group.label], groups[group.key], columns));
  }

  function attentionBodies(entries) {
    return entries
      .filter((entry) => entry.items.length > 0)
      .map((entry) => groupBody('agent', ['Agents · ', element('code', '', entry.agent)],
        entry.items, ATTENTION_COLUMNS));
  }

  function groupBody(tone, heading, rows, columns) {
    const th = element('th');
    th.colSpan = columns.length;
    th.scope = 'rowgroup';
    th.append(...heading, ' ', element('span', 'count', String(rows.length)));
    const headRow = element('tr');
    headRow.append(th);

    const body = element('tbody', tone);
    body.append(headRow, ...rows.map((row) => cellRow(row, columns)));
    return body;
  }

  function cellRow(row, columns) {
    const tr = element('tr');
    tr.append(...columns.map((column) => element('td', column.cell, row[column.field])));
    return tr;
  }

  function linkItems(links) {
    return links.map((link) => {
      const anchor = element('a', '', link.label);
      anchor.href = link.href;
      const item = element('li');
      item.append(anchor);
      return item;
    });
  }

  function element(tag, className = '', content = '') {
    const node = document.createElement(tag);
    node.className = className;
    node.textContent = content;
    return node;
  }

  // Validation: a check takes (value, path) and returns a list of problem messages.

  function shapeProblems(value, schema, path) {
    if (!isRecord(value)) return [`${path} must be an object`];

    const keys = Object.keys(schema);
    const present = keys.filter((key) => Object.hasOwn(value, key));
    const missing = keys
      .filter((key) => !Object.hasOwn(value, key))
      .map((key) => `${path}.${key} is missing`);
    const unknown = Object.keys(value)
      .filter((key) => !Object.hasOwn(schema, key))
      .map((key) => `${path}.${key} is not a known key`);
    const invalid = present.flatMap((key) => schema[key](value[key], `${path}.${key}`));

    return [...missing, ...unknown, ...invalid];
  }

  function shape(schema) {
    return (value, path) => shapeProblems(value, schema, path);
  }

  function listOf(check) {
    return (value, path) => Array.isArray(value)
      ? value.flatMap((entry, index) => check(entry, `${path}[${index}]`))
      : [`${path} must be a list`];
  }

  function rowSchema(columns) {
    return Object.fromEntries(columns.map((column) => [column.field, text]));
  }

  function groupsSchema(groups, columns) {
    const rows = listOf(shape(rowSchema(columns)));
    return Object.fromEntries(groups.map((group) => [group.key, rows]));
  }

  function text(value, path) {
    return typeof value === 'string' ? [] : [`${path} must be a string`];
  }

  function relativeHref(value, path) {
    if (typeof value !== 'string') return text(value, path);

    return isRelativePath(value) ? [] : [`${path} must be a path relative to this page`];
  }

  // RFC 3986 relative-path reference: no leading slash and no colon in the first segment,
  // so no scheme (javascript:, https:) and no absolute path. Backslashes are refused
  // because browsers may read them as slashes.
  function isRelativePath(href) {
    const firstSegment = href.split('/')[0];
    return href !== '' && !href.startsWith('/') && !firstSegment.includes(':')
      && !href.includes('\\');
  }

  function isRecord(value) {
    return typeof value === 'object' && value !== null && !Array.isArray(value);
  }
</script>
</body>
</html>
